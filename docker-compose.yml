version: '3.8'

services:

  mysql:
    image: mysql:8
    container_name: cq_mysql

    environment:
      MYSQL_ROOT_PASSWORD: checkmatequestroot
      MYSQL_DATABASE: checkmatequest

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
    
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-pcheckmatequestroot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend

    container_name: cq_backend

    depends_on:
      mysql:
        condition: service_healthy

    env_file:
      - ./backend/.env
    
    environment:
      DATABASE_URL: mysql://root:checkmatequestroot@mysql:3306/checkmatequest

    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend

    container_name: cq_frontend

    depends_on:
      - backend

    environment:
      VITE_API_URL: http://localhost:3000

    ports:
      - "5173:5173"

volumes:
  mysql_data: